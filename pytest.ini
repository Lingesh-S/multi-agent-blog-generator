[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage
addopts =
    --verbose
    --color=yes
    --cov=src
    --cov-report=html
    --cov-report=term-missing

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    requires_llm: Tests requiring LLM connection
    requires_search: Tests requiring internet connection

# Logging
log_cli = true
log_cli_level = INFO
